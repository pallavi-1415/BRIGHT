            - heading "Look and listen" [level=3] [ref=f10e204]
            - paragraph [ref=f10e205]: A 3D scan and a gentle exam, narrated as we go. You see everything we see, on the screen above the chair.
            - paragraph [ref=f10e206]: Raise your left hand any time and we pause.
        - listitem [ref=f10e207]:
