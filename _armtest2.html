<!DOCTYPE html>
<html><head><style>html,body{margin:0;background:#cfd8c4}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.setClearColor(0xcfd8c4);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff6e0, 0x6d7d5c, 1.2));
const key = new THREE.DirectionalLight(0xffefd0, 2.2); key.position.set(2, 3, 4); scene.add(key);
const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 100); cam.position.set(0, -0.05, 1.7);
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const poses = JSON.parse(q.get('poses') || '[[0,0,0,0]]'); // [lift, pitch, roll, push]
new GLTFLoader().load('assets/models/mascot.glb', (g) => {
  const mesh = g.scene.getObjectByProperty('isMesh', true);
  const pos = mesh.geometry.attributes.position;
  const base = pos.array.slice();
  const w = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) { const y = base[i*3+1], z = base[i*3+2]; w[i] = ss(-0.17,-0.12,y)*(1-ss(-0.02,0.03,y))*ss(0.05,0.1,z); }
  const P = [0, -0.08, 0.06];
  scene.add(g.scene);
  const n = poses.length, W = innerWidth / n;
  r.setScissorTest(true);
  poses.forEach(([lift, pitch, roll, push], j) => {
    for (let i = 0; i < pos.count; i++) {
      const k = w[i];
      let x = base[i*3] - P[0], y = base[i*3+1] - P[1], z = base[i*3+2] - P[2];
      const a = pitch * k, ca = Math.cos(a), sa = Math.sin(a);
      [y, z] = [y * ca - z * sa, y * sa + z * ca];
      const b = roll * k, cb = Math.cos(b), sb = Math.sin(b);
      [x, y] = [x * cb - y * sb, x * sb + y * cb];
      pos.setXYZ(i, x + P[0], y + P[1] + lift * k, z + P[2] + push * k);
    }
    pos.needsUpdate = true; mesh.geometry.computeVertexNormals();
    g.scene.rotation.y = (+q.get('yaw') || 0) * Math.PI / 180;
    r.setViewport(j * W, 0, W, innerHeight); r.setScissor(j * W, 0, W, innerHeight);
    cam.aspect = W / innerHeight; cam.updateProjectionMatrix(); r.render(scene, cam);
  });
  window.done = true;
});
</script></body></html>
