<!DOCTYPE html>
<html><head><style>html,body{margin:0;background:#cfd8c4}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'weights';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.setClearColor(0xcfd8c4);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff6e0, 0x6d7d5c, 1.2));
const key = new THREE.DirectionalLight(0xffefd0, 2.2); key.position.set(2, 3, 4); scene.add(key);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.set(0, 0.0, 2.6);
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
window.ss = ss;
new GLTFLoader().load('assets/models/mascot.glb', (g) => {
  const mesh = g.scene.getObjectByProperty('isMesh', true);
  const geo = mesh.geometry, pos = geo.attributes.position;
  const fn = new Function('x','y','z','ss', q.get('w') || 'return ss(-0.17,-0.12,y)*(1-ss(-0.02,0.03,y))*ss(0.05,0.1,z);');
  const w = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) w[i] = fn(pos.getX(i), pos.getY(i), pos.getZ(i), ss);
  if (mode === 'weights') {
    const col = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) { col[i*3] = w[i]; col[i*3+1] = 0.2; col[i*3+2] = 1 - w[i]; }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    mesh.material = new THREE.MeshStandardMaterial({ vertexColors: true });
  } else {
    const dx = +q.get('dx') || 0, dy = +q.get('dy') || 0, dz = +q.get('dz') || 0, rot = +q.get('rot') || 0;
    const px = +q.get('px') || 0, py = +q.get('py') || 0, pz = +q.get('pz') || 0;
    for (let i = 0; i < pos.count; i++) {
      const k = w[i]; if (!k) continue;
      let x = pos.getX(i) - px, y = pos.getY(i) - py, z = pos.getZ(i) - pz;
      const a = rot * k, c = Math.cos(a), s = Math.sin(a);
      const ny = y * c - z * s, nz = y * s + z * c;
      pos.setXYZ(i, x + px + dx * k, ny + py + dy * k, nz + pz + dz * k);
    }
    pos.needsUpdate = true; geo.computeVertexNormals();
  }
  scene.add(g.scene);
  const views = (q.get('views') || '0,40').split(',').map(Number);
  const n = views.length, W = innerWidth / n;
  r.setScissorTest(true);
  views.forEach((deg, i) => {
    g.scene.rotation.y = deg * Math.PI / 180;
    r.setViewport(i * W, 0, W, innerHeight); r.setScissor(i * W, 0, W, innerHeight);
    cam.aspect = W / innerHeight; cam.updateProjectionMatrix(); r.render(scene, cam);
  });
  window.done = true;
});
</script></body></html>
